name: Daily gas & LNG flow data refresh

on:
  schedule:
    # Daily at 06:15 UTC = ~9:15am Paphos/Cyprus time while EEST (UTC+3) is
    # in effect — offset a quarter past the hour from the crude-flow
    # dashboard's own daily run so the two don't fire in the same minute.
    # GitHub evaluates cron in UTC; this doesn't need adjusting for the
    # 09:00 Europe/Nicosia week-ending cutoff, since that's about how each
    # week's headline figures are framed, not when checks run. Cyprus drops
    # out of daylight saving in late October — from then, 9:15am Paphos is
    # UTC+2, so this line would need to become "15 7 * * *" to stay at
    # 9:15am local.
    - cron: "15 6 * * *"
  workflow_dispatch: {} # lets you also trigger a run manually from the Actions tab

permissions:
  contents: write   # Claude needs to commit + push the updated data.json
  id-token: write    # required for the Claude GitHub App's default authentication

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure git identity for Claude's commit
        run: |
          git config --global user.name "Gas & LNG Flow Dashboard Bot"
          git config --global user.email "actions@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Follow the daily data refresh procedure in CLAUDE.md exactly,
            start to finish, including committing and pushing the updated
            data.json yourself. This is an unattended scheduled run.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
            --max-turns 40
